<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DotDissolveTransition — section boundary test</title>
<style>
  html, body { margin: 0; font: 16px system-ui; }
  section { position: relative; height: 100vh; display: flex; align-items: center; padding: 0 60px; overflow: hidden; }
  .s1 { background: #2a221c; color: #E8DCC8; }
  .s2 { background: #EFE6D8; color: #2b241c; }
  .s3 { background: #3a2f28; color: #E8DCC8; }
  h1 { font-size: 48px; margin: 0; }
  .dissolveCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 400px; pointer-events: none; }
  #label {
    position: fixed; top: 16px; left: 16px; z-index: 60; max-width: 420px;
    font: 12px/1.4 monospace; color: #E8DCC8; background: rgba(0,0,0,0.7);
    padding: 10px 14px; border-radius: 4px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="label">Scroll down slowly. Each section (2 and 3) should materialize from a dot dissolve as it enters, instead of a plain cut/fade.</div>

<section class="s1"><h1>SECTION 1 (no dissolve, just the starting point)</h1></section>
<section class="s2"><canvas class="dissolveCanvas" id="d2"></canvas><h1>SECTION 2 — should dissolve in from dots</h1></section>
<section class="s3"><canvas class="dissolveCanvas" id="d3"></canvas><h1>SECTION 3 — should dissolve in from dots</h1></section>

<script type="module">
import { DotDissolveTransition } from './dot-dissolve-transition.js';

const DISSOLVE_ZONE_PX = 500;

function setup(canvasId, sectionEl, dotColor) {
  const canvas = document.getElementById(canvasId);
  const d = new DotDissolveTransition(canvas, { dotColor });
  function resize() {
    d.resize(sectionEl.clientWidth, 400, Math.min(window.devicePixelRatio || 1, 2));
  }
  resize();
  window.addEventListener('resize', resize);
  return d;
}

const d2 = setup('d2', document.querySelector('.s2'), [0x2a, 0x22, 0x1c]); // s2 canvas covers with s1's dark color, dissolving to reveal s2's cream
const d3 = setup('d3', document.querySelector('.s3'), [0xEF, 0xE6, 0xD8]); // s3 covers with s2's cream, dissolving to reveal s3's dark

window.__d2 = d2; window.__d3 = d3; // debugging only

function updateAll() {
  [[d2, document.querySelector('.s2')], [d3, document.querySelector('.s3')]].forEach(([d, el]) => {
    const rect = el.getBoundingClientRect();
    const progress = (window.innerHeight - rect.top) / DISSOLVE_ZONE_PX;
    d.setProgress(progress);
    d.render();
  });
}
window.addEventListener('scroll', updateAll, { passive: true });
updateAll();
</script>
</body>
</html>
