name = "new-website"
account_id = "16fb0031f94577847d90d30361194cb2"
main = "worker/index.js"
compatibility_date = "2026-07-27"
# Variables and secrets are installed in the Cloudflare dashboard; never let a deploy wipe them.
keep_vars = true

# The custom domain ensemble-ai.io is bound to this Worker. Declared here so the config matches the
# dashboard and a deploy never reports (or applies) drift on it.
routes = [
  { pattern = "ensemble-ai.io", zone_name = "ensemble-ai.io", custom_domain = true },
]

[assets]
directory = "./"
binding = "ASSETS"

# Per-IP hourly limits for /api/analyze (5 analyses per hour). The built-in rate-limit binding
# only supports 10s/60s windows, so this is a small SQLite-backed Durable Object.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
